global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s

scrape_configs:
  - job_name: petclinic
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app1:8080"]
        labels:
          app: app1
      - targets: ["app2:8080"]
        labels:
          app: app2

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
