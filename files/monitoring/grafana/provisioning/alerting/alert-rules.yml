apiVersion: 1

groups:
  - orgId: 1
    name: week6-petclinic
    folder: Week6
    interval: 10s
    rules:
      # 규칙 ①: 앱이 죽으면 알린다.
      # A(쿼리) → B(축약) → C(비교) 세 덩어리로 되어 있다.
      # 쿼리 결과는 시점별 값의 나열이라 그대로는 참/거짓을 말할 수 없다.
      # 그래서 마지막 값 하나로 줄인 뒤(B) 임계값과 비교한다(C).
      - uid: week6-app-down
        title: PetClinic app DOWN
        condition: C
        for: 20s
        annotations:
          summary: "PetClinic 앱이 응답하지 않습니다"
          description: "job=petclinic 의 up 지표가 1 미만입니다. 앱이 죽었거나 Prometheus가 지표를 읽지 못하는 상태입니다."
        labels:
          severity: critical
        isPaused: false
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: up{job="petclinic"}
              instant: false
              range: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      # 규칙 ②: 5xx 오류율이 올라가면 알린다.
      # 8-3에서 두 앱을 모두 죽여 Nginx가 우회할 곳이 없어질 때 발생한다.
      - uid: week6-5xx-rate
        title: PetClinic 5xx 오류율 증가
        condition: C
        for: 20s
        annotations:
          summary: "5xx 오류율이 5%를 넘었습니다"
          description: "최근 1분간 5xx 응답 비율이 5%를 초과했습니다. 사용자가 실제로 오류 화면을 보고 있는 상태입니다."
        labels:
          severity: warning
        isPaused: false
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              # `or vector(0)`이 없으면 5xx가 한 건도 없을 때 결과가 아예 비어
              # NoData 상태가 되고, 그것만으로 경고가 울린다.
              expr: 100 * (sum(rate(http_server_requests_seconds_count{job="petclinic", uri!="/actuator/prometheus", status=~"5.."}[1m])) or vector(0)) / clamp_min(sum(rate(http_server_requests_seconds_count{job="petclinic", uri!="/actuator/prometheus"}[1m])), 0.001)
              instant: false
              range: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
